<!doctype html><html><head><meta charset="utf-8"><title>MBA - The 4 Ps of Marketing</title>
<link rel="stylesheet" href="../../engine/base.css">
<style>
/* ===== MBA world: Boardroom ===== */
:root{--paper:#F5F1E8;--paper2:#EEE8DB;--ink:#14213D;--ink2:#3A4560;--muted:#8A8274;--line:#E2DACB;--gold:#B8862F;--gold2:#E9D9B5;--card:#FFFFFF;--choc:#5A3825}
#stage{background:var(--paper);font-family:Inter;color:var(--ink)}
#bgv{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 40%,rgba(255,255,255,.55),rgba(255,255,255,0) 60%),radial-gradient(140% 120% at 50% 50%,rgba(0,0,0,0) 62%,rgba(90,70,40,.08))}
#prog{position:absolute;left:0;top:0;height:6px;width:1920px;background:var(--line);z-index:60}
#prog i{display:block;height:6px;background:var(--gold);width:0}
#cam{position:absolute;left:0;top:0;width:1920px;height:1080px}
.serif{font-family:Fraunces;font-variation-settings:"SOFT" 30,"WONK" 0,"opsz" 144;font-weight:600;letter-spacing:-.015em}
.chip{position:absolute;display:inline-flex;align-items:center;gap:14px;height:44px;padding:0 20px;border-radius:22px;background:var(--ink);color:#F5E7C6;font:600 18px Inter;letter-spacing:.16em;white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:4px;background:var(--gold)}
#title{position:absolute;left:0;top:0;font-size:124px;line-height:1.05;white-space:nowrap;transform-origin:0 0;color:var(--ink)}
#title .acc{color:var(--gold)}
#sub{position:absolute;left:0;top:640px;width:1920px;text-align:center;font:500 32px Inter;color:var(--muted)}
#rule{position:absolute;left:840px;top:612px}
.card{position:absolute;background:var(--card);border-radius:28px;box-shadow:0 1px 0 rgba(20,33,61,.04),0 18px 40px -12px rgba(20,33,61,.14)}
#hero{left:160px;top:270px;width:616px;height:580px;overflow:hidden}
#heroIn{position:absolute;inset:0}
#hname{position:absolute;left:0;width:616px;top:452px;text-align:center;font-size:44px}
#htag{position:absolute;left:0;width:616px;text-align:center;top:516px;font:600 16px Inter;letter-spacing:.14em;color:var(--muted);white-space:nowrap}
.pc{position:absolute;width:460px;height:274px;border-radius:28px;overflow:hidden}
.pc .bg{position:absolute;inset:0;border-radius:28px;background:var(--card);border:2px solid var(--line)}
.pc .num{position:absolute;left:36px;top:34px;font:600 22px Inter;letter-spacing:.14em;color:var(--gold)}
.pc .ic{position:absolute;right:30px;top:26px;width:64px;height:64px;border-radius:32px;background:var(--paper);display:flex;align-items:center;justify-content:center}
.pc .tt{position:absolute;left:36px;top:84px;font-size:56px;white-space:nowrap}
.pc .ds{position:absolute;left:36px;top:160px;font:500 26px Inter;white-space:nowrap}
.pc .vl{position:absolute;left:36px;top:206px;height:44px;padding:0 18px;border-radius:22px;display:flex;align-items:center;font:600 21px Inter;white-space:nowrap;background:var(--paper);color:var(--ink)}
#sweep{position:absolute;left:0;top:0;width:1920px;height:1080px;background:var(--ink);z-index:40}
#sweep b{position:absolute;left:0;top:0;width:10px;height:1080px;background:var(--gold)}
.opt{position:absolute;top:452px;width:376px;height:230px;border-radius:28px}
.opt .bg{position:absolute;inset:0;border-radius:28px;background:var(--card);border:2px solid var(--line)}
.opt .lt{position:absolute;left:32px;top:30px;width:52px;height:52px;border-radius:26px;background:var(--paper);display:flex;align-items:center;justify-content:center;font:700 22px Inter;color:var(--ink)}
.opt .ot{position:absolute;left:32px;top:136px;font-size:48px;white-space:nowrap}
.opt .ok{position:absolute;right:30px;top:30px;width:52px;height:52px;border-radius:26px;background:var(--gold);display:flex;align-items:center;justify-content:center}
#qq{position:absolute;left:160px;top:250px;font-size:76px;white-space:nowrap}
#ring{position:absolute;left:1610px;top:236px;width:150px;height:150px}
#ringN{position:absolute;left:0;top:0;width:150px;height:150px;display:flex;align-items:center;justify-content:center;font-size:64px}
#take{position:absolute;left:160px;top:730px;width:1600px;height:96px;border-radius:24px;background:var(--ink);color:#fff;display:flex;align-items:center;gap:22px;padding:0 36px}
#take .tx{font-size:40px;white-space:nowrap}
.cap{font:600 38px Inter;color:var(--ink);background:rgba(255,255,255,.96);padding:12px 30px;border-radius:40px;box-shadow:0 10px 30px -10px rgba(20,33,61,.25)}
.cap .cw{color:#5B647A}.cap .cw.on{color:var(--ink)}.cap .cw.act{color:var(--gold)}
</style></head><body>
<div id="stage">
  <div id="bgv"></div>
  <div id="cam">
    <!-- title + header (shared elements) -->
    <div class="chip" id="eyebrow"><i></i>MBA · MARKETING</div>
    <div class="serif" id="title">The <span class="acc">4 P's</span> of Marketing</div>
    <div id="sub">Explained with one chocolate bar</div>
    <svg id="rule" width="240" height="8"><line id="ruleL" x1="0" y1="4" x2="240" y2="4" stroke="#B8862F" stroke-width="4" stroke-linecap="round"/></svg>

    <!-- scene B -->
    <div class="card" id="hero"><div id="heroIn">
      <div id="ph" style="position:absolute;left:158px;top:110px;width:300px;height:260px;border-radius:24px;border:3px dashed #E2DACB;display:flex;align-items:center;justify-content:center"><span class="serif" style="font-size:120px;color:#D9CFBC">?</span></div>
      <svg id="awn" width="616" height="120" style="position:absolute;left:0;top:0">
        <g id="awnG"></g>
      </svg>
      <div id="shopSign" style="position:absolute;left:0;width:616px;top:122px;text-align:center;font:600 18px Inter;letter-spacing:.16em;color:var(--muted)">CORNER SHOP</div>
      <svg id="barSvg" width="616" height="420" style="position:absolute;left:0;top:40px">
        <g id="waves" fill="none" stroke="#B8862F" stroke-width="5" stroke-linecap="round">
          <path id="w1" d="M118 238 a40 40 0 0 1 0 -56"/><path id="w2" d="M96 254 a66 66 0 0 1 0 -88"/>
          <path id="w3" d="M498 182 a40 40 0 0 1 0 56"/><path id="w4" d="M520 166 a66 66 0 0 1 0 88"/>
        </g>
        <line id="shelf" x1="96" y1="306" x2="520" y2="306" stroke="#D9CFBC" stroke-width="10" stroke-linecap="round"/>
        <g id="bar" transform="translate(308 210)">
          <g transform="rotate(-6)">
            <rect x="-170" y="-62" width="340" height="124" rx="16" fill="#14213D"/>
            <rect x="-170" y="-62" width="64" height="124" rx="16" fill="#5A3825"/>
            <rect x="-120" y="-62" width="14" height="124" fill="#5A3825"/>
            <path d="M-162 -20 h40 M-162 20 h40" stroke="#3E2618" stroke-width="5"/>
            <path d="M-106 -62 l10 14 l-10 14 l10 14 l-10 14 l10 14 l-10 14 l10 14 l-10 14 l10 14" fill="none" stroke="#0E1830" stroke-width="3"/>
            <rect x="-70" y="-30" width="208" height="60" rx="10" fill="none" stroke="#B8862F" stroke-width="3"/>
            <text x="34" y="10" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="30" fill="#E9D9B5" letter-spacing="2">CHOCO</text>
          </g>
        </g>
        <g id="tag" transform="translate(452 112)">
          <g id="tagR">
            <line x1="0" y1="0" x2="0" y2="40" stroke="#8A8274" stroke-width="3"/>
            <path d="M-46 40 h92 v66 a10 10 0 0 1 -10 10 h-72 a10 10 0 0 1 -10 -10 z" fill="#B8862F"/>
            <circle cx="0" cy="54" r="6" fill="#F5F1E8"/>
            <text x="0" y="102" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="34" fill="#14213D">₹20</text>
          </g>
        </g>
      </svg>
      <div class="serif" id="hname">Choco Crunch</div>
      <div id="htag">EXAMPLE PRODUCT</div>
    </div></div>
    <div id="grid"></div>

    <!-- scene C: quick check -->
    <div id="quiz">
      <div class="chip" id="qchip" style="left:160px;top:120px"><i></i>QUICK CHECK</div>
      <div class="serif" id="qq">A poster on a bus is which P?</div>
      <svg id="ring" viewBox="0 0 150 150"><circle cx="75" cy="75" r="66" fill="#fff" stroke="#E2DACB" stroke-width="8"/><circle id="ringA" cx="75" cy="75" r="66" fill="none" stroke="#B8862F" stroke-width="8" stroke-linecap="round" transform="rotate(-90 75 75)"/></svg>
      <div class="serif" id="ringN" style="left:1610px;top:236px;position:absolute"></div>
      <div id="opts"></div>
      <div id="take"><span id="takeI"></span><span class="serif tx" id="takeT">All four P's right = the product sells</span></div>
    </div>
  </div>
  <div id="sweep"><b></b></div>
  <div id="prog"><i></i></div>
  <div class="cap" id="cap"></div>
</div>
<script src="cues.js"></script>
<script src="../../engine/core.js"></script>
<script src="../../engine/outro.js"></script>
<script src="scene.js"></script>
<script>M.start()</script>
</body></html>
