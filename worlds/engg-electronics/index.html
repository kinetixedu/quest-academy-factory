<!doctype html><html><head><meta charset="utf-8"><title>Engg Electronics - What a diode does</title>
<link rel="stylesheet" href="../../engine/base.css">
<style>
/* ===== Engg Electronics world: Circuit board (PCB macro) ===== */
:root{--pcb:#0B2A20;--pcb2:#0F3328;--tr:#1F4A3A;--cu:#D9A35B;--cud:#4A3A22;--silk:#E9F2EC;--mut:#7FA595;--dim:#3F6B5A;--red:#FF4D4D;--grn:#3DDC84}
#stage{background:var(--pcb);font-family:'IBM Plex Mono';color:var(--silk)}
#prog{position:absolute;left:0;top:0;height:6px;width:1920px;background:#123B2D;z-index:60}
#prog i{display:block;height:6px;background:var(--cu);width:0}
#cam{position:absolute;left:0;top:0;width:1920px;height:1080px}
#old{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.h{font-family:'Chakra Petch';font-weight:600;letter-spacing:-.01em}
.lab{font:600 18px 'IBM Plex Mono';letter-spacing:.14em;color:var(--mut);white-space:nowrap}
.chip{position:absolute;display:inline-flex;align-items:center;gap:14px;height:44px;padding:0 18px;background:var(--cu);color:var(--pcb);font:600 18px 'IBM Plex Mono';letter-spacing:.14em;white-space:nowrap;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%)}
.chip i{width:10px;height:10px;border-radius:5px;background:var(--pcb)}
#title{position:absolute;left:0;top:0;font-size:150px;line-height:1;white-space:nowrap;transform-origin:0 0}
#title .c{color:var(--cu)}
#sub{position:absolute;left:160px;top:596px;font:500 34px 'Chakra Petch';color:var(--mut);white-space:nowrap}
#troute{position:absolute;left:0;top:0;width:1920px;height:1080px}
.holes{position:absolute;left:0;top:0;width:1920px;height:1080px}
#board{position:absolute;left:0;top:0;width:1920px;height:1080px}
.row{position:absolute;left:1248px;width:512px;height:158px;background:var(--pcb2);border:2px solid var(--tr);border-radius:6px;clip-path:polygon(0 0,calc(100% - 20px) 0,100% 20px,100% 100%,0 100%)}
.row .lab{position:absolute;left:32px;top:30px}
.row .v{position:absolute;left:32px;top:64px;font:600 54px 'Chakra Petch';line-height:1.1;white-space:nowrap}
.row .ind{position:absolute;right:32px;top:45px;width:64px;height:64px;border-radius:6px;background:var(--pcb);border:2px solid var(--tr);display:flex;align-items:center;justify-content:center}
.led{width:30px;height:30px;border-radius:15px;background:#1C3A2F;border:3px solid #2E5A49}
#holeOut{position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:30}
/* quiz */
#quiz{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:960px 540px}
#qq{position:absolute;left:160px;top:150px;font-size:64px;line-height:1;white-space:nowrap}
.opt{position:absolute;left:160px;width:1056px;height:112px}
.opt .bg{position:absolute;inset:0;background:var(--pcb2);border:2px solid var(--tr);border-radius:6px}
.opt .lt{position:absolute;left:28px;top:28px;width:56px;height:56px;background:var(--cud);color:var(--cu);display:flex;align-items:center;justify-content:center;font:600 26px 'IBM Plex Mono';border-radius:4px}
.opt .ot{position:absolute;left:120px;top:30px;font:600 44px 'Chakra Petch';line-height:1.1;white-space:nowrap}
.opt .led{position:absolute;right:40px;top:38px;width:36px;height:36px;border-radius:18px}
#cd{position:absolute;left:1248px;top:290px;width:512px;height:400px;background:var(--pcb2);border:2px solid var(--tr);border-radius:6px;clip-path:polygon(0 0,calc(100% - 24px) 0,100% 24px,100% 100%,0 100%)}
#cd .lab{position:absolute;left:32px;top:30px}
#cdn{position:absolute;left:32px;top:72px;font:600 200px 'Chakra Petch';line-height:1;color:var(--silk)}
#cdl{position:absolute;left:32px;top:318px;width:448px;height:48px}
#cdl .led{position:absolute;top:6px;width:36px;height:36px;border-radius:18px}
#take{position:absolute;left:160px;top:738px;width:1600px;height:96px;background:var(--cu);color:var(--pcb);display:flex;align-items:center;gap:22px;padding:0 34px;border-radius:6px;clip-path:polygon(0 0,calc(100% - 24px) 0,100% 24px,100% 100%,0 100%)}
#take .tx{font:600 40px 'Chakra Petch';white-space:nowrap}
.cap{font:600 38px 'Chakra Petch';color:#E9F2EC;background:#0F3328;border:2px solid #1F4A3A;padding:10px 28px;border-radius:6px}
.cap .cw{color:#6E9283}.cap .cw.on{color:#E9F2EC}.cap .cw.act{color:#D9A35B}
</style></head><body>
<div id="stage">

    <div id="old">

      <div id="scene">
        <svg id="board"></svg>
        <div class="row" id="row0" style="top:290px"><div class="lab">BATTERY</div><div class="v" id="v0">--</div><div class="ind" id="i0"></div></div>
        <div class="row" id="row1" style="top:480px"><div class="lab">CURRENT</div><div class="v" id="v1">--</div><div class="ind" id="i1"></div></div>
        <div class="row" id="row2" style="top:670px"><div class="lab">LED1</div><div class="v" id="v2">--</div><div class="ind"><div class="led" id="i2"></div></div></div>
      </div>
    </div>
    <svg id="holeOut"><circle id="hoC" cx="960" cy="540" r="0" fill="#04110C"/></svg>
    <div id="quiz">
      <div class="chip" id="qchip" style="left:160px;top:96px"><i></i>QUICK CHECK</div>
      <div class="h" id="qq">What does a diode do?</div>
      <div id="opts"></div>
      <div id="cd"><div class="lab" id="cdlab">TIMER</div><div id="cdn">3</div><div id="cdl"></div></div>
      <div id="take"><span id="takeI"></span><span class="tx" id="takeT">Diode = one way gate. Forward flows, backward is blocked.</span></div>
    </div>
  </div>
  <div id="prog"><i></i></div>
  <div class="cap" id="cap"></div>
</div>
