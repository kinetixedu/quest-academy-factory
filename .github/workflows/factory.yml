name: Quest Academy factory

# Renders every video marked READY (videos/<slug>/READY), then uploads it to YouTube
# with thumbnail, English captions, playlist and a scheduled publish slot.
on:
  push:
    branches: [main]
    paths: ['videos/**/READY', '.github/workflows/**', 'tools/**']
  schedule:
    - cron: '17 */3 * * *'      # every 3 hours, picks up anything still waiting (quota-limited runs)
  workflow_dispatch:
    inputs:
      preview:
        description: 'Build this video slug for review only (no upload)'
        required: false
        default: ''

concurrency:
  group: factory
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
      count: ${{ steps.p.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        env:
          PREVIEW: ${{ github.event.inputs.preview }}
        run: |
          M=$(python3 tools/plan.py)
          echo "matrix=$M" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$M" | python3 -c 'import json,sys;print(len(json.load(sys.stdin)["include"]))')" >> "$GITHUB_OUTPUT"
          echo "$M"

  playlists:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -q google-api-python-client google-auth
      - name: Make sure every category playlist exists (once, before parallel uploads)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          mkdir -p registry; [ -f registry/playlists.json ] || echo '{}' > registry/playlists.json
          python3 - <<'PY'
          import os
          c=os.environ.get('YT_CLIENT_ID',''); s=os.environ.get('YT_CLIENT_SECRET',''); t=os.environ.get('YT_REFRESH_TOKEN','')
          ws=lambda v: 'HAS-SPACES' if v!=v.strip() else 'clean'
          print(f"::notice title=Key check::client_id {c[:6]}...{c[-27:]} len {len(c)} {ws(c)} | secret starts {s[:7]} len {len(s)} {ws(s)} | token starts {t[:4]} len {len(t)} {ws(t)}")
          PY
          if [ -z "$YT_REFRESH_TOKEN" ]; then echo "::warning::YouTube secrets not set yet - videos will be built but not uploaded"; exit 0; fi
          python3 tools/upload.py --ensure-playlists
      - uses: actions/upload-artifact@v4
        with: { name: playlists, path: registry/playlists.json }

  build:
    needs: [plan, playlists]
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      KOKORO_DIR: ${{ github.workspace }}/.kokoro/kokoro-multi-lang-v1_0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: .kokoro
          key: kokoro-multi-lang-v1_0
      - name: Download voice model
        run: |
          if [ ! -d "$KOKORO_DIR" ]; then
            mkdir -p .kokoro && cd .kokoro
            curl -sSL -o k.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-multi-lang-v1_0.tar.bz2
            tar xjf k.tar.bz2 && rm k.tar.bz2
          fi
      - name: Cache browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-1.56.1
      - name: Install tools
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          pip install -q sherpa-onnx numpy scipy google-api-python-client google-auth
      - uses: actions/download-artifact@v4
        with: { name: playlists, path: registry }
      - name: Build video
        run: tools/build.sh videos/${{ matrix.slug }}
      - name: Review pack (contact sheet + facts)
        run: tools/review.sh videos/${{ matrix.slug }}
      - name: Keep build (video, thumbnail, captions, review; 7 days)
        uses: actions/upload-artifact@v4
        with:
          name: built-${{ matrix.slug }}
          path: |
            videos/${{ matrix.slug }}/final.mp4
            videos/${{ matrix.slug }}/captions.srt
            videos/${{ matrix.slug }}/thumbnail.jpg
            videos/${{ matrix.slug }}/review/
          retention-days: 7

  record:
    # uploads in episode order (one job, so a quota stop never leaves gaps), then commits the records
    needs: [plan, playlists, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -q google-api-python-client google-auth
      - uses: actions/download-artifact@v4
        with: { pattern: 'built-*', path: _built }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: playlists, path: registry }
      - name: Upload to YouTube in order, retry pending thumbnails/captions/playlists, commit records
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          shopt -s nullglob
          for d in _built/built-*; do
            slug="${d#_built/built-}"; mkdir -p "videos/$slug"
            cp -r "$d/videos/$slug/"* "videos/$slug/" 2>/dev/null || cp -r "$d/"* "videos/$slug/"
          done
          if [ -n "$YT_REFRESH_TOKEN" ] && [ -n "$MATRIX" ]; then python3 tools/upload.py --batch || echo "::error::batch upload failed"; fi
          if [ -n "$YT_REFRESH_TOKEN" ]; then python3 tools/upload.py --fix-pending || true; fi
          python3 tools/queue.py sync
          git config user.name "quest-factory-bot"; git config user.email "factory@users.noreply.github.com"
          git add -A videos registry queue
          git diff --cached --quiet || git commit -m "Record uploads [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 5; done
