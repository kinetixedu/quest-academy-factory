<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="node_modules/katex/dist/katex.min.css">
<script src="node_modules/katex/dist/katex.min.js"></script>
<style>
@font-face{font-family:Poppins;font-weight:500;src:url(/home/claude/quest-academy-factory/fonts/poppins-latin-500-normal.woff2)}
@font-face{font-family:Poppins;font-weight:600;src:url(/home/claude/quest-academy-factory/fonts/poppins-latin-600-normal.woff2)}
@font-face{font-family:Poppins;font-weight:700;src:url(/home/claude/quest-academy-factory/fonts/poppins-latin-700-normal.woff2)}
@font-face{font-family:Plex;font-weight:400;src:url(/home/claude/quest-academy-factory/fonts/IBMPlexMono-Regular.ttf)}
@font-face{font-family:Plex;font-weight:600;src:url(/home/claude/quest-academy-factory/fonts/IBMPlexMono-SemiBold.ttf)}
:root{--ink:#16213E;--paper:#F7F5EF;--grid:#E9E5DA;--ac:#2F6FEB;--red:#D64545;--ok:#2E9E5B;--mute:#6B7280}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1920px;height:1080px;overflow:hidden;font-family:Poppins;font-weight:500;color:var(--ink);
 background:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:40px 40px;position:relative}
.edge{position:absolute;left:0;top:0;bottom:0;width:14px;background:var(--ac)}
.chip{position:absolute;left:80px;top:52px;font:600 22px Plex;letter-spacing:.06em;color:var(--ac);background:#fff;border:2px solid var(--ac);border-radius:10px;padding:8px 18px}
.subj{position:absolute;right:80px;top:52px;font:600 20px Plex;letter-spacing:.08em;color:#fff;background:var(--ac);border-radius:10px;padding:10px 18px}
h1{position:absolute;left:80px;top:112px;font:700 54px Poppins;letter-spacing:-.01em}
.card{position:absolute;background:#fff;border-radius:18px;border-top:6px solid var(--ac);box-shadow:0 2px 0 rgba(22,33,62,.06),0 10px 30px rgba(22,33,62,.08)}
.lbl{font:600 18px Plex;letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
.mono{font-family:Plex}
.foot{position:absolute;left:80px;bottom:34px;font:700 20px Poppins;letter-spacing:.12em;color:#9AA0AC}
.sample{position:absolute;right:80px;bottom:30px;font:600 16px Plex;letter-spacing:.1em;color:#9AA0AC;border:1.5px dashed #B8BCC6;border-radius:8px;padding:6px 12px}
.av{position:absolute;display:flex;align-items:center;gap:14px}
.av .f{width:84px;height:84px;border-radius:50%;background:#fff;border:4px solid var(--ac);display:flex;align-items:center;justify-content:center;font:700 34px Poppins;color:var(--ac)}
.av .b{background:#fff;border:2px solid var(--ink);border-radius:18px;padding:12px 18px;font:500 22px Poppins;max-width:430px;line-height:1.3}
.ro{display:grid;grid-template-columns:auto 1fr auto;column-gap:18px;row-gap:12px;align-items:baseline}
.ro .k{font:600 30px Plex}.ro .v{font:600 34px Plex;text-align:right}.ro .u{font:400 22px Plex;color:var(--mute)}
.step{display:flex;gap:20px;align-items:center;font-size:30px;margin-bottom:22px}
.step .n{flex:none;width:46px;height:46px;border-radius:50%;border:2.5px solid var(--ac);color:var(--ac);font:700 22px Poppins;display:flex;align-items:center;justify-content:center}
.step.hi{background:#FFF1EC;border-radius:14px;padding:10px 14px;margin-left:-14px}
.katex{font-size:1.05em}
/* exam frame */
.q{font:600 34px Poppins;line-height:1.35}
.opt{display:flex;align-items:center;gap:18px;border:2.5px solid #D9DCE3;border-radius:16px;padding:16px 22px;font:500 30px Poppins;background:#fff}
.opt .L{flex:none;width:48px;height:48px;border-radius:12px;background:var(--ink);color:#fff;font:700 24px Poppins;display:flex;align-items:center;justify-content:center}
.pat{display:inline-block;font:600 18px Plex;letter-spacing:.08em;color:var(--ac);background:#fff;border:2px solid var(--ac);border-radius:8px;padding:6px 12px}
.wrong{font-size:27px;color:#8A1C1C;position:relative;display:inline-block}
.wrong::after{content:"";position:absolute;left:-6px;right:-6px;top:52%;height:4px;background:var(--red);border-radius:2px}
.right{font-size:27px;color:#1F6B3F}
.mk{display:inline-flex;width:38px;height:38px;border-radius:50%;align-items:center;justify-content:center;color:#fff;font:700 22px Poppins;margin-right:14px;vertical-align:middle}
.wa{display:flex;gap:12px;flex-wrap:wrap}
.wa span{font:600 18px Plex;letter-spacing:.06em;padding:8px 14px;border-radius:9px;border:2px solid #CBD0DA;color:#9AA0AC;background:#fff}
.wa span.on{border-color:var(--ac);color:#fff;background:var(--ac)}
.pin{position:absolute;top:-22px;left:50%;margin-left:-16px;width:32px;height:32px;border-radius:50%;background:var(--red);box-shadow:inset -4px -4px 0 rgba(0,0,0,.18)}
.shot{position:absolute;right:22px;top:22px;font:600 16px Plex;letter-spacing:.08em;color:#fff;background:var(--ink);border-radius:8px;padding:6px 12px}
.fl{font-size:34px;margin:14px 0}
</style></head>
<body>
<div class="edge"></div>
<div class="chip" id="chip"></div>
<div class="subj" id="subj"></div>
<h1 id="title"></h1>
<div id="stage"></div>
<div class="foot">QUEST ACADEMY</div>
<div class="sample" id="sample">STYLE SAMPLE</div>
<script>
const P=new URLSearchParams(location.search), S=P.get('s'), F=P.get('f')||'1';
const K=(tex,d)=>katex.renderToString(tex,{displayMode:!!d,throwOnError:false});
const C={physics:'#2F6FEB',chemistry:'#0FA3A3',maths:'#E4572E',biology:'#3E9B5F',electronics:'#E8A317'};
document.documentElement.style.setProperty('--ac',C[S]);
const st=document.getElementById('stage');
const set=(chip,subj,title)=>{chip_.textContent=chip;subj_.textContent=subj;title_.textContent=title};
const chip_=document.getElementById('chip'),subj_=document.getElementById('subj'),title_=document.getElementById('title');
const av=(x,y,who,txt)=>`<div class="av" style="left:${x}px;top:${y}px"><div class="f">${who[0]}</div><div class="b"><b>${who}:</b> ${txt}</div></div>`;

/* ---------- shared exam frame ---------- */
function exam(o){
  const opts=o.opts.map((t,i)=>`<div class="opt"><div class="L">${'ABCD'[i]}</div><div>${t}</div></div>`).join('');
  const r=70,c=2*Math.PI*r, frac=3/5;
  st.innerHTML=`
  <div class="card" style="left:80px;top:210px;width:1060px;height:780px;padding:40px 44px">
    <div style="display:flex;justify-content:space-between;align-items:center"><span class="pat">${o.pat}</span><span class="lbl">Pause and solve</span></div>
    <div class="q" style="margin:26px 190px 30px 0">${o.q}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px">${opts}</div>
    <div style="margin-top:34px" class="lbl">Where it is asked</div>
    <div class="wa" style="margin-top:12px">${['JEE MAIN','JEE ADVANCED','NEET','PUC BOARDS'].map(w=>`<span class="${o.wa.includes(w)?'on':''}">${w}</span>`).join('')}</div>
    <div style="position:absolute;left:44px;right:44px;bottom:36px;border:2.5px dashed #D9DCE3;border-radius:14px;padding:18px 22px;font:500 24px Poppins;color:#9AA0AC">Answer + step-by-step solution animates here after the countdown</div>
    <svg width="180" height="180" style="position:absolute;right:40px;top:96px">
      <circle cx="90" cy="90" r="${r}" fill="none" stroke="#E6E8EE" stroke-width="14"/>
      <circle cx="90" cy="90" r="${r}" fill="none" stroke="${C[S]}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${c*frac} ${c}" transform="rotate(-90 90 90)"/>
      <text x="90" y="112" text-anchor="middle" font-family="Plex" font-weight="600" font-size="64" fill="#16213E">3</text>
    </svg>
  </div>
  <div class="card" style="left:1180px;top:210px;width:660px;height:300px;padding:30px 34px;border-top-color:var(--red)">
    <div class="lbl" style="color:var(--red)">Exam trap</div>
    <div style="margin-top:22px"><span class="mk" style="background:var(--red)">✕</span><span class="wrong">${o.wrong}</span></div>
    <div style="margin-top:24px;display:flex;align-items:flex-start"><span class="mk" style="background:var(--ok);flex:none">✓</span><span class="right">${o.right}</span></div>
  </div>
  <div class="card" style="left:1180px;top:560px;width:660px;height:430px;padding:40px 36px 20px;transform:rotate(-1.2deg)">
    <div class="pin"></div><div class="shot">SCREENSHOT THIS</div>
    <div class="lbl">${o.cardTitle}</div>
    ${o.card.map(x=>`<div class="fl">${x}</div>`).join('')}
  </div>`;
}

/* ---------- PHYSICS ---------- */
if(S==='physics'&&F==='1'){
  set('CLASS 11 · PHYSICS · CH 3 MOTION IN A PLANE','MOTION NOTEBOOK','Projectile motion: one throw, two motions');
  const vx='#2F6FEB',vy='#7A4FE0',g='#D64545';
  const X=x=>120+20*x, Y=y=>560-20*y;
  const pts=[[.25],[.5],[.75]].map(([t])=>[X(14.142*t),Y(14.142*t-5*t*t)]);
  const bx=X(14.142),by=Y(9.142);
  st.innerHTML=`
  <div class="card" style="left:80px;top:210px;width:1060px;height:640px">
    <div class="lbl" style="position:absolute;left:30px;top:24px">Simulation · u = 20 m/s · θ = 45°</div>
    <div class="mono" style="position:absolute;right:28px;top:20px;font:600 18px Plex;letter-spacing:.08em;color:#fff;background:var(--ink);border-radius:8px;padding:6px 12px">SLOW-MO REPLAY · 0.25x</div>
    <svg width="1060" height="640" style="position:absolute;left:0;top:0">
      <line x1="60" y1="560" x2="1000" y2="560" stroke="#16213E" stroke-width="3"/>
      ${Array.from({length:9},(_,i)=>`<line x1="${X(i*5)}" y1="560" x2="${X(i*5)}" y2="570" stroke="#16213E" stroke-width="2"/><text x="${X(i*5)}" y="596" text-anchor="middle" font-family="Plex" font-size="18" fill="#6B7280">${i*5}</text>`).join('')}
      <text x="1000" y="596" text-anchor="end" font-family="Plex" font-size="18" fill="#6B7280">x (m)</text>
      <path d="M120,560 Q520,160 920,560" fill="none" stroke="#16213E" stroke-width="2.5" stroke-dasharray="3 9" stroke-linecap="round" opacity=".45"/>
      <path d="${Array.from({length:21},(_,i)=>{const t=i/20;return (i?'L':'M')+X(14.142*t).toFixed(1)+','+Y(14.142*t-5*t*t).toFixed(1)}).join(' ')}" fill="none" stroke="${vx}" stroke-width="4" opacity=".5"/>
      ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="18" fill="#16213E" opacity="${[.12,.2,.32][i]}"/>`).join('')}
      <path d="M140,560 A20,20 0 0 0 134.1,545.9" fill="none" stroke="#16213E" stroke-width="2"/>
      <text x="150" y="540" font-family="Poppins" font-style="italic" font-size="24" fill="#16213E">θ</text>
      <line x1="${bx}" y1="${by}" x2="${bx+150}" y2="${by}" stroke="${vx}" stroke-width="6" marker-end="url(#ab)"/>
      <line x1="${bx}" y1="${by}" x2="${bx}" y2="${by-46}" stroke="${vy}" stroke-width="6" marker-end="url(#ap)"/>
      <line x1="${bx}" y1="${by}" x2="${bx}" y2="${by+110}" stroke="${g}" stroke-width="6" marker-end="url(#ar)"/>
      <line x1="${bx}" y1="${by}" x2="${bx+150}" y2="${by-46}" stroke="#16213E" stroke-width="2.5" stroke-dasharray="7 6"/>
      <circle cx="${bx}" cy="${by}" r="18" fill="#16213E"/>
      <text x="${bx+160}" y="${by+8}" font-family="Poppins" font-style="italic" font-weight="600" font-size="28" fill="${vx}">v<tspan font-size="18" dy="6">x</tspan></text>
      <text x="${bx-56}" y="${by-60}" font-family="Poppins" font-style="italic" font-weight="600" font-size="28" fill="${vy}">v<tspan font-size="18" dy="6">y</tspan></text>
      <text x="${bx+16}" y="${by+120}" font-family="Poppins" font-style="italic" font-weight="600" font-size="28" fill="${g}">g</text>
      <text x="${bx+160}" y="${by-50}" font-family="Poppins" font-style="italic" font-weight="600" font-size="26" fill="#16213E">v</text>
      <defs>${[['ab',vx],['ap',vy],['ar',g]].map(([i,c])=>`<marker id="${i}" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${c}"/></marker>`).join('')}</defs>
    </svg>
  </div>
  <div class="card" style="left:1180px;top:210px;width:660px;height:330px;padding:28px 36px">
    <div class="lbl">Live readout</div>
    <div class="ro" style="margin-top:20px">
      <span class="k">t</span><span class="v">1.00</span><span class="u">s</span>
      <span class="k" style="color:${vx}">v<sub>x</sub></span><span class="v" style="color:${vx}">14.1</span><span class="u">m/s</span>
      <span class="k" style="color:${vy}">v<sub>y</sub></span><span class="v" style="color:${vy}">4.1</span><span class="u">m/s</span>
      <span class="k" style="color:${g}">g</span><span class="v" style="color:${g}">10.0</span><span class="u">m/s²</span>
    </div>
  </div>
  <div class="card" style="left:1180px;top:570px;width:660px;height:280px">
    <div class="lbl" style="position:absolute;left:30px;top:22px">Height y vs time t</div>
    <svg width="660" height="280" style="position:absolute;left:0;top:0">
      <line x1="70" y1="235" x2="620" y2="235" stroke="#16213E" stroke-width="2.5"/><line x1="70" y1="235" x2="70" y2="65" stroke="#16213E" stroke-width="2.5"/>
      <path d="${Array.from({length:41},(_,i)=>{const t=i/40*2.828;return (i?'L':'M')+(70+t*190).toFixed(1)+','+(235-(14.142*t-5*t*t)*15).toFixed(1)}).join(' ')}" fill="none" stroke="#16213E" stroke-width="2.5" stroke-dasharray="3 8" opacity=".4"/>
      <path d="${Array.from({length:15},(_,i)=>{const t=i/14;return (i?'L':'M')+(70+t*190).toFixed(1)+','+(235-(14.142*t-5*t*t)*15).toFixed(1)}).join(' ')}" fill="none" stroke="${vy}" stroke-width="5"/>
      <circle cx="260" cy="${235-9.142*15}" r="11" fill="#16213E"/>
      <line x1="260" y1="${235-9.142*15}" x2="260" y2="235" stroke="#16213E" stroke-dasharray="4 5"/>
      <text x="260" y="262" text-anchor="middle" font-family="Plex" font-size="18" fill="#6B7280">1.0 s</text>
      <text x="612" y="262" text-anchor="end" font-family="Plex" font-size="18" fill="#6B7280">t (s)</text>
      <text x="278" y="${235-9.142*15-14}" font-family="Plex" font-weight="600" font-size="20" fill="#16213E">y = 9.1 m</text>
    </svg>
  </div>
  <div class="card" style="left:80px;top:880px;width:1060px;height:120px;display:flex;align-items:center;justify-content:space-around;font-size:34px">
    <span>${K(`x = (\\textcolor{${vx}}{u\\cos\\theta})\\,t`)}</span>
    <span>${K(`y = (\\textcolor{${vy}}{u\\sin\\theta})\\,t - \\tfrac{1}{2}\\textcolor{${g}}{g}\\,t^2`)}</span>
  </div>
  ${av(1180,890,'Aarav','So sideways it never slows down?')}`;
}
if(S==='physics'&&F==='2'){
  set('CLASS 11 · PHYSICS · CH 3 MOTION IN A PLANE','MOTION NOTEBOOK','Practice question');
  exam({pat:'JEE MAIN PATTERN · ORIGINAL QUESTION',
   q:'Two balls are thrown with the same speed, one at 30° and one at 60° above the horizontal. What is the ratio of their maximum heights, H<sub>30</sub> : H<sub>60</sub> ?',
   opts:['1 : 1','1 : √3','1 : 3','3 : 1'], wa:['JEE MAIN','PUC BOARDS'],
   wrong:'Same range, so same height',
   right:'Same range for θ and 90° − θ, but heights differ (sin²θ)',
   cardTitle:'Projectile · formula card',
   card:[K('R = \\dfrac{u^2 \\sin 2\\theta}{g}'),K('H = \\dfrac{u^2 \\sin^2\\theta}{2g}'),K('T = \\dfrac{2u \\sin\\theta}{g}')]});
}

/* ---------- CHEMISTRY ---------- */
const atom=(cx,cy,sym,z,shells,omit,col)=>{
  let s=`<circle cx="${cx}" cy="${cy}" r="38" fill="${col}"/><text x="${cx}" y="${cy+4}" text-anchor="middle" font-family="Poppins" font-weight="700" font-size="30" fill="#fff">${sym}</text><text x="${cx}" y="${cy+26}" text-anchor="middle" font-family="Plex" font-size="14" fill="#fff">${z}</text>`;
  shells.forEach((n,k)=>{const r=70+k*48;s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#16213E" stroke-width="1.6" opacity=".35"/>`;
    for(let i=0;i<n;i++){if(omit&&k===shells.length-1&&i===omit-1)continue;const a=(i/n)*2*Math.PI-Math.PI/2+k*.3;s+=`<circle cx="${(cx+r*Math.cos(a)).toFixed(1)}" cy="${(cy+r*Math.sin(a)).toFixed(1)}" r="9" fill="#16213E"/>`}});
  return s};
if(S==='chemistry'&&F==='1'){
  set('CLASS 11 · CHEMISTRY · CH 4 CHEMICAL BONDING AND MOLECULAR STRUCTURE','MOLECULE BENCH','Ionic bond: one electron jumps');
  const e='#C2410C';
  st.innerHTML=`
  <div class="card" style="left:80px;top:210px;width:1100px;height:600px">
    <div class="lbl" style="position:absolute;left:30px;top:24px">Bench · sodium meets chlorine</div>
    <svg width="1100" height="600" style="position:absolute;left:0;top:0">
      ${atom(290,330,'Na',11,[2,8,1],1,'#16213E')}
      ${atom(810,330,'Cl',17,[2,8,7],0,'#0FA3A3')}
      <circle cx="810" cy="${330-166}" r="11" fill="none" stroke="${e}" stroke-width="3" stroke-dasharray="4 4"/>
      <path d="M${290+166*Math.cos(-0.3)},${330+166*Math.sin(-0.3)} C 520,90 640,80 798,${330-166}" fill="none" stroke="${e}" stroke-width="3.5" stroke-dasharray="10 9" marker-end="url(#ae)"/>
      ${[.15,.3,.45].map((o,i)=>`<circle cx="${520+i*48}" cy="${120-i*6}" r="10" fill="${e}" opacity="${o}"/>`).join('')}
      <circle cx="668" cy="104" r="13" fill="${e}"/><text x="668" y="78" text-anchor="middle" font-family="Poppins" font-style="italic" font-weight="600" font-size="26" fill="${e}">e⁻</text>
      <text x="290" y="560" text-anchor="middle" font-family="Plex" font-weight="600" font-size="24" fill="#16213E">2, 8, 1</text>
      <text x="810" y="560" text-anchor="middle" font-family="Plex" font-weight="600" font-size="24" fill="#0FA3A3">2, 8, 7 → 2, 8, 8</text>
      <defs><marker id="ae" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${e}"/></marker></defs>
    </svg>
  </div>
  <div class="card" style="left:1220px;top:210px;width:620px;height:380px;padding:30px 36px;font-size:36px">
    <div class="lbl">Reaction, step by step</div>
    <div style="margin-top:18px">${K(`\\mathrm{Na} \\rightarrow \\mathrm{Na^+} + \\textcolor{${e}}{e^-}`)}</div>
    <div style="margin-top:14px">${K(`\\mathrm{Cl} + \\textcolor{${e}}{e^-} \\rightarrow \\mathrm{Cl^-}`)}</div>
    <div style="margin-top:14px">${K(`\\mathrm{Na^+} + \\mathrm{Cl^-} \\rightarrow \\mathrm{NaCl}`)}</div>
  </div>
  <div class="card" style="left:1220px;top:620px;width:620px;height:190px;padding:26px 36px">
    <div class="lbl">Balance counter</div>
    <div class="ro" style="grid-template-columns:1fr auto auto auto;margin-top:16px">
      <span class="k" style="font-size:26px">Na</span><span class="v" style="font-size:28px">1 | 1</span><span></span><span style="color:var(--ok);font:700 28px Poppins">✓</span>
      <span class="k" style="font-size:26px">Charge</span><span class="v" style="font-size:28px">0 | 0</span><span></span><span style="color:var(--ok);font:700 28px Poppins">✓</span>
    </div>
  </div>
  <div class="card" style="left:80px;top:840px;width:1100px;height:150px;padding:20px 30px">
    <div class="lbl">Periodic table · period 3</div>
    <div style="display:flex;gap:14px;margin-top:14px">${['Na','Mg','Al','Si','P','S','Cl','Ar'].map(x=>`<div style="width:112px;height:66px;border-radius:10px;display:flex;align-items:center;justify-content:center;font:700 28px Poppins;${['Na','Cl'].includes(x)?'background:#0FA3A3;color:#fff':'border:2px solid #D9DCE3;color:#9AA0AC'}">${x}</div>`).join('')}</div>
  </div>
  ${av(1220,860,'Diya','So salt is held together by plus and minus?')}`;
}
if(S==='chemistry'&&F==='2'){
  set('CLASS 11 · CHEMISTRY · CH 4 CHEMICAL BONDING AND MOLECULAR STRUCTURE','MOLECULE BENCH','Practice question');
  exam({pat:'NEET PATTERN · ORIGINAL QUESTION',
   q:'Which of these ionic compounds has the highest lattice enthalpy?',
   opts:['NaCl','KCl','MgO','CsCl'], wa:['NEET','PUC BOARDS'],
   wrong:'Bigger ions make a stronger lattice',
   right:'Smaller ions with bigger charges hold tighter',
   cardTitle:'Ionic bonding · fact card',
   card:['Ionic bond = electron <b>transfer</b>','Covalent bond = electron <b>sharing</b>',K('\\text{Lattice enthalpy} \\;\\propto\\; \\dfrac{q_+\\,q_-}{r_+ + r_-}')]});
}

/* ---------- MATHS ---------- */
if(S==='maths'&&F==='1'){
  set('CLASS 11 · MATHEMATICS · CH 3 TRIGONOMETRIC FUNCTIONS','PROOF BOARD','Why sin²θ + cos²θ = 1');
  const sn='#E4572E',cs='#2F6FEB',th='#7A4FE0';
