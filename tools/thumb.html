<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../engine/base.css">
<style>
html,body{width:1280px;height:720px;background:#000}
#t{position:relative;width:1280px;height:720px;overflow:hidden}
#bg{position:absolute;inset:0}
#glow{position:absolute;inset:0;background:radial-gradient(70% 90% at 78% 50%,rgba(255,255,255,.10),rgba(255,255,255,0) 60%)}
#frame{position:absolute;left:660px;top:150px;width:620px;height:349px;border-radius:22px;overflow:hidden;transform:rotate(-3deg);box-shadow:0 30px 60px -10px rgba(0,0,0,.55);border:6px solid rgba(255,255,255,.9)}
#frame img{width:100%;height:100%;object-fit:cover;display:block}
#kick{position:absolute;left:64px;top:64px;height:52px;padding:0 22px;border-radius:26px;display:flex;align-items:center;font:800 24px Inter;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
#head{position:absolute;left:60px;top:150px;width:560px;font-weight:800;line-height:1.0;letter-spacing:-.015em}
#head .a{display:inline}
#brand{position:absolute;left:64px;bottom:56px;display:flex;align-items:center;gap:14px;font:700 28px Inter;white-space:nowrap}
#brand i{width:52px;height:52px;border-radius:26px;display:flex;align-items:center;justify-content:center;font:800 30px Inter;font-style:normal;border:4px solid}
#bar{position:absolute;left:0;top:0;width:16px;height:720px}
</style></head><body>
<div id="t"><div id="bg"></div><div id="glow"></div><div id="bar"></div>
<div id="frame"><img id="fimg"></div>
<div id="kick"></div><div id="head"></div>
<div id="brand"><i>Q</i><span>Quest Academy</span></div></div>
<script>
const D = window.THUMB;
const $ = s => document.querySelector(s);
$('#bg').style.background = D.bg; $('#bar').style.background = D.accent;
$('#kick').textContent = D.kicker; $('#kick').style.background = D.accent; $('#kick').style.color = D.bg;
const h = $('#head'); h.style.fontFamily = `'${D.font}', Inter`; h.style.color = D.ink;
h.innerHTML = D.title.replace(new RegExp('(' + (D.accent_word || '@@').replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'i'), `<span style="color:${D.accent}">$1</span>`);
$('#fimg').src = D.frame;
$('#brand').style.color = D.ink; $('#brand i').style.borderColor = D.accent; $('#brand i').style.color = D.ink;
// fit headline: largest size (<= 128px) that fits 3 lines in 620x420
(async () => { await document.fonts.ready; await new Promise(r => $('#fimg').complete ? r() : $('#fimg').onload = r);
  let s = 132; do { s -= 4; h.style.fontSize = s + 'px'; } while ((h.scrollHeight > 400 || h.scrollWidth > h.clientWidth + 1) && s > 52);
  window.ready = true; })();
</script></body></html>
